# Builds every pull request and posts a temporary preview link on it,
# so you can check changes before they reach the live site.
name: Preview pull request

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Secrets aren't available to pull requests from forks, so only preview our own branches.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase settings
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: printf '%s\n' "$ENV_LOCAL" > .env.production.local

      - name: Build
        run: npm run build

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEON_WALK_CLUB }}
          projectId: neon-walk-club
          expires: 7d
